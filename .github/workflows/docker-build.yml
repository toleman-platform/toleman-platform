name: Docker Images Build

# Why this exists: every other CI job runs Python and Node directly on the
# runner, against whatever is already installed there. None of them build the
# images `docker-compose.yml` actually ships, so a broken image could -- and
# did -- reach main with all checks green.
#
# The break that prompted this: nothing in the backend image asks for
# setuptools directly, but semgrep's pinned opentelemetry-instrumentation
# declares `setuptools>=16.0`, so pip resolved the newest one. setuptools
# 82.0.0 removed `pkg_resources`, which that same module imports, so
# `semgrep --version` died at build time. requirements.txt had not changed;
# a transitive resolve drifted underneath it. Only an actual image build
# catches that class of failure.
#
# Runs after merge rather than on every PR, since a full multi-image build is
# minutes of wall-clock and the failure mode is a dependency resolving
# differently over time, not a code change. The exception is a PR that
# touches the build inputs themselves -- there, waiting until after merge to
# find out would defeat the point.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "backend/Dockerfile.hardened"
      - "backend/requirements.txt"
      - "frontend/Dockerfile"
      - "frontend/package-lock.json"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  # A scheduled run is what actually catches the drift case: the inputs are
  # unchanged, but what they resolve to today is not what they resolved to
  # last month.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the frontend build because the backend failed -- when
      # both are broken, one run should report both.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: backend-hardened
            context: backend
            dockerfile: backend/Dockerfile.hardened
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Never pushed: this job proves the image builds, it does not
          # publish. Loaded into the local daemon so the next step can
          # actually run the thing that was just built.
          push: false
          load: true
          tags: rikugan-${{ matrix.name }}:ci
          # Deliberately no cache. A cached layer is exactly what would hide a
          # dependency resolving differently, which is what this job detects.
          no-cache: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000

      # "docker build succeeded" only proves the install commands exited zero.
      # It does not prove the binaries still run -- and a scanner that is
      # missing or broken fails silently at runtime, producing zero findings
      # that look exactly like a clean repo. So execute every bundled tool.
      #
      # Skipped for the distroless hardened image, which has no shell and no
      # Python entrypoint to drive this with; its scanners come from the same
      # install steps as the standard image, which is verified here.
      - name: Verify bundled scanners actually run
        if: matrix.name == 'backend'
        run: docker run --rm rikugan-${{ matrix.name }}:ci python scripts/verify_tools.py

  compose-config:
    # Cheap and fast, so it runs regardless of the image builds: catches a
    # compose file that references a service, image or build context that
    # does not exist.
    runs-on: ubuntu-latest
    name: validate docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
