{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toleman.fullname" . }}-app-secrets
  labels:
    {{- include "toleman.labels" . | nindent 4 }}
type: Opaque
stringData:
  # See app/core/config.py: SESSION_SECRET/ADMIN_PASSWORD must be changed
  # from their defaults before this Secret's values matter (validate_
  # production_secrets() refuses to start otherwise once ENVIRONMENT is
  # non-"local", which values.config.environment defaults to). Leaving
  # these blank in values.yaml on purpose; a chart default lives in git.
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  PLATFORM_ENCRYPTION_KEY: {{ .Values.secrets.platformEncryptionKey | quote }}
{{- end }}
