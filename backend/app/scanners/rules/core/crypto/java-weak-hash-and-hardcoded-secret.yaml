## Weak hash on a secret value (CWE-327) + hardcoded secret assignment
## (CWE-798), Java.
##
## Validated 2026-09-12 against OWASP WebGoat (scratchpad/webgoat,
## src/main/java/org/owasp/webgoat/lessons/cryptography/ and
## org/owasp/webgoat/lessons/jwt/).
##
## `toleman-java-weak-hash-md5-sha1` is deliberately broad/LOW, same as this
## pack's Python `toleman-weak-hash-on-secret-value`: it flags every
## MessageDigest.getInstance("MD5"/"SHA-1"/"SHA1") call regardless of what's
## being hashed, because "is this input actually a low-entropy secret" isn't
## reliably answerable from the call site alone. Confirmed against
## HashingAssignment.java that this stays quiet on the SHA-256 call in the
## same file/class (getHash(secret, "SHA-256")) and on missingac/
## DisplayUser.java's unrelated SHA-256 use -- only the literal "MD5" call
## fires.
##
## `toleman-java-hardcoded-secret-assignment` did NOT reuse this pack's
## Python `toleman-hardcoded-encryption-key-or-iv-assignment` DEFAULT_-prefix
## exclusion, on purpose, after checking whether it applied: that exclusion
## exists in the Python rule to skip BaseSettings dev-fallback constants
## meant to be overridden by env vars in production. WebGoat's own
## DEFAULT_PASSWORD constants (DefaultUserInitializer.java:27 = "webgoat",
## securitymisconfiguration/DefaultCredentialsTask.java:29 = "admin") are the
## OPPOSITE case -- WebGoat's SecurityMisconfiguration lesson is literally
## about a hardcoded default credential being a real vulnerability (CWE-798
## is its own named class for exactly this), so porting the Python
## exclusion here would have silently suppressed the one real hit this rule
## is supposed to find. Checked for the Java equivalent of the Python
## BaseSettings-default false positive (a Spring `@Value("${prop:default}")`
## field/parameter with an inline fallback baked into the annotation string)
## instead: that shape has no separate `$VAR = "literal"` Java assignment
## for this pattern to match in the first place (the default lives inside
## the annotation's SpEL string, not as a field initializer), so it's
## already excluded by construction -- confirmed no `@Value(...)` usage
## anywhere in WebGoat's src/main/java carries a secret-shaped property name
## with an inline default, so this is unproven-by-sample rather than a
## verified true negative.
##
## Known FP-shaped hit, kept and documented rather than hidden: WebGoat's
## own lessons/challenges/SolutionConstants.java:10 `String PASSWORD =
## "!!webgoat_admin_1234!!";` matches this rule's pattern (it's a plain
## interface constant literally named PASSWORD) but is a CTF-answer fixture,
## not a credential guarding any real resource -- there is no syntactic
## signal in Java to distinguish this from a real hardcoded secret, which is
## exactly why this rule is LOW confidence and framed as "make a human
## check this", not "this is always wrong".
rules:
  - id: toleman-java-weak-hash-md5-sha1
    languages: [java]
    severity: WARNING
    confidence: LOW
    message: >-
      MessageDigest.getInstance("MD5"/"SHA-1") is a fast, unsalted hash. If
      what's being hashed is a human-chosen password or other low-entropy
      secret, this is brute-forceable with commodity hardware (CWE-327) --
      use a slow, salted KDF (PBKDF2WithHmacSHA256, bcrypt, or argon2)
      instead. If the input is already high-entropy (a random token), a fast
      hash may be fine for a checksum/comparison; this rule can't tell the
      difference and needs a human to.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      references:
        - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
      validated-against:
        - "webgoat: true positive, org/owasp/webgoat/lessons/cryptography/HashingAssignment.java:39 -- `MessageDigest md = MessageDigest.getInstance(\"MD5\");` hashing `secret`, one of WebGoat's own demo passwords (SECRETS[] array containing \"password\", \"123456\", \"passw0rd\", etc.) -- exactly the low-entropy-secret case this rule targets"
        - "webgoat: true negative -- same file's getHash(secret, \"SHA-256\") call and missingac/DisplayUser.java's unrelated MessageDigest.getInstance(\"SHA-256\") call both correctly did not fire (SHA-256 isn't in the flagged-algorithm list)"
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: MessageDigest.getInstance("SHA1")

  - id: toleman-java-hardcoded-secret-assignment
    languages: [java]
    severity: WARNING
    confidence: LOW
    message: >-
      A string literal is assigned to a field/variable whose name suggests
      it's a password, secret, API key, or signing key (CWE-798). Anyone
      with source access (or a decompiled JAR) can read this value. Load it
      from an environment variable, application property backed by a
      secrets manager, or a Spring `@Value` injection instead of a literal.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated-against:
        - "webgoat: true positive, org/owasp/webgoat/lessons/jwt/JWTRefreshEndpoint.java:45-46 -- `public static final String PASSWORD = \"bm5nhSkxCXZkKRy4\"; private static final String JWT_PASSWORD = \"bm5n3SkxCX4kKRy4\";`, the second of which is used elsewhere in the same class as the HMAC signing key for a JWT via Jwts.builder().signWith(...) -- a hardcoded JWT signing secret is WebGoat's own JWT lesson's actual bug"
        - "webgoat: true positive (default-credential class, CWE-798's other named case, not a false positive despite the DEFAULT_ prefix), org/owasp/webgoat/container/users/DefaultUserInitializer.java:27 `private static final String DEFAULT_PASSWORD = \"webgoat\";` and securitymisconfiguration/DefaultCredentialsTask.java:29 `private static final String DEFAULT_PASSWORD = \"admin\";` -- WebGoat's SecurityMisconfiguration lesson is literally built around this exact hardcoded-default-credential shape, which is why this rule does NOT carry this pack's Python sibling's DEFAULT_-prefix exclusion (see file header)"
        - "webgoat: known FP-shaped hit (documented, not suppressed), lessons/challenges/SolutionConstants.java:10 `String PASSWORD = \"!!webgoat_admin_1234!!\";` -- a CTF-answer fixture, not a real credential; no syntactic signal distinguishes it from a genuine hardcoded secret, which is exactly why this rule stays LOW confidence"
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          # Substring match, case-insensitive, with the explicit .* wrapper
          # this pack's own gotcha #1 requires (metavariable-regex anchors
          # like re.match, not re.search -- an unwrapped alternation only
          # matches from position 0 and silently misses "JWT_PASSWORD" or
          # "LEAKED_API_KEY" if written as (password|api_key)$ instead).
          regex: (?i).*(password|passwd|_secret|^secret|secret_key|api_key|apikey|signing_key|jwt_key|jwt_secret|private_key|access_key).*
      - pattern-not: $VAR = ""
      - pattern-not-inside: |
          @Value(...)
          $T $FIELD = "...";
