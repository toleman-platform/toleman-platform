## Hardcoded secret/credential literal (CWE-798), Go.
##
## Validated 2026-09-12 against 0c34/govwa (real, runnable vulnerable Go
## app): vulnerability/csa/csa.go:49,
## `sotp := "a587cd6bf1e49d2c3928d1f8b86f248b"` -- a hardcoded MD5 hash of
## the "server one-time-password" compared against user input in the very
## next few lines (`if sotp != Md5Sum(otp)`). Anyone with source access can
## read this constant and pass the OTP check without ever seeing a real
## OTP. Same file also demonstrates why this rule is scoped to
## secret-shaped names, not "any string literal": csaHandler's `id :=
## fmt.Sprintf(...)` a few lines up is not a credential and correctly
## doesn't match.
##
## Excludes obvious placeholder/example/test values, same false-positive
## lesson this pack already hit with Python's BaseSettings defaults
## (crypto/hardcoded-encryption-key-or-iv.yaml): don't flag
## "changeme"/"example"/"test"/"xxx"/empty-string sentinels, which are
## expected, documented dev-only placeholders, not real leaked secrets.
##
## Not validated against go-dvwa or go-test-bench: neither hardcodes a
## credential-shaped literal anywhere in its app code (go-dvwa's DB is an
## in-memory sqlite with no credentials at all; go-test-bench's exercises
## don't touch auth). Both true negatives, not misses -- confirmed by
## grepping both repos for secret/password/token/apikey-named
## assignments before writing this rule and finding zero hits.
rules:
  - id: toleman-go-hardcoded-secret-literal
    languages: [go]
    severity: ERROR
    confidence: MEDIUM
    message: >-
      A string literal is assigned to a variable/constant whose name
      suggests it's a secret, password, token, or API key (CWE-798).
      Anyone with source/repo access can read this value, and it can't be
      rotated without a code change and redeploy. Load it from an
      environment variable or a secrets manager instead.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated-against:
        - "govwa: 1/1 true positive (vulnerability/csa/csa.go:49, sotp := \"a587cd6bf1e49d2c3928d1f8b86f248b\", a hardcoded OTP-verification hash)"
        - "go-dvwa: true negative (no secret-shaped literal assignments in the repo)"
        - "go-test-bench: true negative for this shape (checked internal/injection and internal/ssrf packages actually exercised for this pack; none hardcode a credential)"
    patterns:
      - pattern-either:
          - pattern: $VAR := "..."
          - pattern: $VAR = "..."
          - pattern: var $VAR string = "..."
          - pattern: var $VAR = "..."
          - pattern: const $VAR = "..."
          - pattern: const $VAR string = "..."
      - metavariable-regex:
          metavariable: $VAR
          # Substring match, case-insensitive -- wrapped in .* because
          # semgrep's metavariable-regex anchors like re.match, not
          # re.search (this pack's own documented gotcha: an unwrapped
          # alternation only matches from position 0 and silently misses
          # anything not at the very start of the identifier).
          regex: (?i).*(secret|password|passwd|pwd|apikey|api_key|token|otp|privatekey|private_key|accesskey|access_key).*
      - pattern-not: $VAR := ""
      - pattern-not: $VAR = ""
      - pattern-not: $VAR := "changeme"
      - pattern-not: $VAR = "changeme"
      - pattern-not: $VAR := "example"
      - pattern-not: $VAR = "example"
      - pattern-not: $VAR := "xxx"
      - pattern-not: $VAR = "xxx"
      - pattern-not: $VAR := "TODO"
      - pattern-not: $VAR = "TODO"
      - pattern-not: $VAR := "your-secret-here"
      - pattern-not: $VAR = "your-secret-here"
      - metavariable-regex:
          # Placeholder/example/test-value exclusion -- same lesson as the
          # Python hardcoded-key rule's BaseSettings/DEFAULT_ guard: a
          # documented dev-only sentinel is not a leaked secret.
          metavariable: $VAR
          regex: (?i)^(?!(test_|example_|default_|dummy_)).*
