## Use of a broken/weak hash (CWE-327), Go crypto/md5 and crypto/sha1.
##
## Validated 2026-09-12 against 0c34/govwa (real, runnable vulnerable Go
## app). 3/3 true positives, all real -- md5.New() is govwa's actual
## integrity/verification primitive, not incidental:
## - user/user.go:160 -- Md5Sum() helper used elsewhere to hash things
##   derived from user-controlled input.
## - vulnerability/csa/csa.go:62 -- Md5Sum(otp) compared against a
##   hardcoded hash to "verify" a one-time password (see
##   go-hardcoded-secret.yaml for the hardcoded-hash half of this same
##   bug).
## - vulnerability/idor/idor.go:164 -- Md5Sum(uid) used as an integrity
##   "signature" over a user id, i.e. a fast, unsalted, unkeyed hash used
##   as if it were a MAC -- forgeable by anyone who can compute MD5.
##
## Deliberately broad and LOW confidence like this pack's Python analogue
## (toleman-weak-hash-on-secret-value): flags every md5/sha1 primitive
## regardless of what's being hashed, including legitimate non-password,
## non-secret uses (a content checksum, a cache key). Triage, don't
## auto-block -- this rule's job is "make a human look here", not "this is
## always wrong".
rules:
  - id: toleman-go-weak-hash-on-secret-value
    languages: [go]
    severity: WARNING
    confidence: LOW
    message: >-
      crypto/md5 or crypto/sha1 used to hash something. If the input is a
      password, OTP, session token, or other value being used for identity
      or integrity verification, these are cryptographically broken/fast
      and forgeable/brute-forceable (CWE-327). Use crypto/hmac with sha256
      for a MAC, or a slow salted KDF (bcrypt/argon2/scrypt) for a
      password. If the input is just content being checksummed (not a
      secret), a fast hash is fine -- this rule can't tell the difference
      and needs a human to.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      references:
        - "https://owasp.org/www-community/vulnerabilities/Insecure_Cryptographic_Storage"
      validated-against:
        - "govwa: 3/3 true positive (user/user.go:160, vulnerability/csa/csa.go:62 -- OTP check, vulnerability/idor/idor.go:164 -- forgeable signature)"
        - "go-dvwa: true negative (no crypto/md5 or crypto/sha1 usage anywhere in the repo)"
        - "go-test-bench: unproven-by-sample (did not check -- out of scope for this pass, repo is large and this rule's shape is simple enough that govwa's 3/3 was sufficient signal)"
    pattern-either:
      - pattern: md5.New()
      - pattern: sha1.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.Sum(...)
