## Unsalted/unstretched password hashing (CWE-916).
##
## Different from the existing toleman-weak-hash-on-secret-value (also in
## this crypto/ directory), which is deliberately broad: it flags every
## hashlib.sha256/sha1/md5(...).hexdigest() call regardless of what's being
## hashed, including legitimate high-entropy-token uses (see that rule's
## own header and toleman's security.py:89/95, where sha256 on an
## os.urandom-backed API token is correct and not a bug). This rule is
## narrower and more precise on purpose: it only fires when the hashed
## value or the enclosing function is actually password-shaped (name
## contains password/passwd/pwd), which is exactly the case where a fast
## hash is a real weakness (human-chosen input, low entropy, brute-forceable
## offline). It should have a materially lower false-positive rate than the
## broad rule for this specific use case, precisely because it ignores the
## token-hashing shape that rule can't distinguish.
##
## Validated 2026-09-12:
## - dvpwa: 1/1 true positive at sqli/dao/user.py:41 --
##   `self.pwd_hash == md5(password.encode('utf-8')).hexdigest()`. Ground
##   truth for this exact line was already established this session (the
##   existing broad weak-hash rule also catches it); confirms this more
##   targeted rule independently catches the same real bug via the
##   password-named-argument path, not just the function-name path. Note
##   the source is `from hashlib import md5` + bare `md5(...)`, not
##   `hashlib.md5(...)` -- semgrep's Python import-equivalence resolves
##   `md5(...)` against the `hashlib.md5(...)` pattern shape automatically,
##   confirmed by testing the existing weak-hash rule against this same
##   file before writing this one.
## - toleman-platform (self): true negative on its own password path --
##   app/core/security.py's hash_password() uses
##   hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 200_000), which
##   is exactly what this rule is designed NOT to flag (a real KDF, salted,
##   200k iterations). Confirmed by hand that this rule produces 0 hits
##   there, i.e. it doesn't repeat the broad rule's noise on the one
##   correct password-hashing call site in this codebase.
## - pygoat: 0 hits. pygoat's own documented 2021-A2 crypto-failure labs
##   (see Solutions/solution.md) are pre-computed hash values given to the
##   user to crack externally (via online hash lookup), not a
##   hashlib-in-source password-check call site this rule's pattern shape
##   can see -- 0 hits here, unproven against this repo, not a
##   contradiction of the dvpwa result.
##
## The KDF-iteration-count half of this file (second rule below) is 0/0/0
## across all three repos -- unproven. None of the three call pbkdf2_hmac
## with a near-zero iteration count; kept in the pack as a distinct,
## plausible variant (a KDF used correctly in shape but defeated by a bad
## iteration count) rather than deleted, but don't cite it as validated.
rules:
  - id: toleman-unsalted-fast-hash-on-password
    languages: [python]
    severity: ERROR
    confidence: MEDIUM
    message: >-
      A password-shaped value is hashed with a fast, unsalted hashlib
      digest (sha256/sha1/md5/sha512/etc via .hexdigest()) instead of a
      slow, salted KDF (CWE-916). Human-chosen passwords have low entropy;
      a fast hash lets an attacker who steals the hash brute-force it
      offline at billions of guesses/sec on commodity GPUs. Use
      hashlib.pbkdf2_hmac with a per-user random salt and a high iteration
      count (or bcrypt/argon2/scrypt) instead.
    metadata:
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      references:
        - "https://owasp.org/www-community/vulnerabilities/Insecure_Storage_of_Sensitive_Information"
      validated-against:
        - "dvpwa: 1/1 true positive (sqli/dao/user.py:41, unsalted MD5 password check -- same ground-truth line as toleman-weak-hash-on-secret-value, caught here via the password-named-argument path)"
        - "toleman-platform (self): true negative (hash_password() already uses pbkdf2_hmac correctly, 200k iterations, per-call salt)"
        - "pygoat: 0 hits (that repo's crypto-failure labs are pre-computed hashes handed to the user, not an in-source hashlib call site) -- unproven against this repo"
    patterns:
      - pattern-either:
          # Shape A: the hashed argument itself is password-named --
          # directly matches dvpwa's `md5(password.encode(...))`.
          - patterns:
              - pattern-either:
                  - pattern: hashlib.$ALG($PW.encode(...)).hexdigest()
                  - pattern: hashlib.$ALG($PW).hexdigest()
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^(sha256|sha1|sha224|sha384|sha512|md5)$
              - metavariable-regex:
                  metavariable: $PW
                  # Same re.match-anchoring gotcha as elsewhere in this pack
                  # (see the SSRF rule and hardcoded-encryption-key-or-iv.yaml)
                  # -- wrap in .* for real substring matching.
                  regex: (?i).*(password|passwd|pwd).*
          # Shape B: the hash call sits inside a function/method whose own
          # name is password-shaped, even if the local variable being
          # hashed was renamed (e.g. `data`, `raw`) on the way in.
          - patterns:
              - pattern-either:
                  - pattern: hashlib.$ALG2(...).hexdigest()
              - metavariable-regex:
                  metavariable: $ALG2
                  regex: (?i)^(sha256|sha1|sha224|sha384|sha512|md5)$
              - pattern-inside: |
                  def $FUNC(...):
                      ...
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: (?i).*(password|passwd|pwd).*

  - id: toleman-kdf-unsafe-iteration-count
    languages: [python]
    severity: ERROR
    confidence: LOW
    message: >-
      hashlib.pbkdf2_hmac called with an iteration count of 0 or 1 (CWE-916).
      A KDF used with a near-zero stretch factor gives essentially none of
      the brute-force resistance the algorithm exists for -- it's
      indistinguishable from a single fast hash. Use a high iteration count
      (OWASP currently recommends >= 600,000 for PBKDF2-SHA256) or switch to
      bcrypt/argon2/scrypt.
    metadata:
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      validated-against:
        - "0 hits on toleman-platform, pygoat, or dvpwa -- unproven. None of the 3 validation repos call pbkdf2_hmac with a near-zero iteration count (toleman's own call uses 200_000). Kept in the pack as a plausible, narrowly-scoped variant, not deleted, but don't cite it as validated against real code."
    patterns:
      - pattern: hashlib.pbkdf2_hmac($HASH, $PW, $SALT, $ITER)
      - metavariable-regex:
          metavariable: $ITER
          regex: ^0*1?$
