name: MCP Server Tests

on:
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-server-tests.yml"
  push:
    branches: [main]
    paths:
      - "mcp-server/**"

# Cancel a superseded run when a branch is pushed again. Without this, every
# amend or force-push during review pays for a full duplicate run of every job
# below -- the previous run keeps going to completion even though its result
# can no longer matter.
#
# `github.ref` is the group key, so pushes to the *same* branch cancel each
# other while different PRs stay independent. main is excluded from
# cancellation via `github.run_id` in the fallback: a push to main should
# always finish, since its result is what the branch protection and the
# post-merge image build rely on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    env:
      RIKUGAN_API_TOKEN: rikugan_pat_test
      RIKUGAN_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v
