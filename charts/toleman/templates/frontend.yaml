apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toleman.fullname" . }}-frontend
  labels:
    {{- include "toleman.componentLabels" (merge (dict "component" "frontend") .) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "toleman.componentLabels" (merge (dict "component" "frontend") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "toleman.componentLabels" (merge (dict "component" "frontend") .) | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://{{ include "toleman.fullname" . }}-backend:{{ .Values.backend.service.port }}/health; do echo waiting for backend; sleep 2; done
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/{{ .Values.image.frontendRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            # See frontend/src/lib/api.ts: server-side rendering inside
            # this container reaches the backend over the cluster-internal
            # Service DNS name, not whatever externally-reachable address
            # PUBLIC_API_URL (below, via the ConfigMap) holds -- those two
            # are frequently different once there's an Ingress in front of
            # either service.
            - name: API_INTERNAL_URL
              value: "http://{{ include "toleman.fullname" . }}-backend:{{ .Values.backend.service.port }}"
          envFrom:
            - configMapRef:
                name: {{ include "toleman.fullname" . }}-config
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "toleman.fullname" . }}-frontend
  labels:
    {{- include "toleman.componentLabels" (merge (dict "component" "frontend") .) | nindent 4 }}
spec:
  selector:
    {{- include "toleman.componentLabels" (merge (dict "component" "frontend") .) | nindent 4 }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
