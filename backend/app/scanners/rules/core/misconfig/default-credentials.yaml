## Authentication check against a hardcoded default credential (CWE-798,
## CWE-521).
##
## The trap this rule exists to avoid (hit for real, once already, in this
## pack): a `BaseSettings` field default like
## `admin_password: str = "changeme123"` is a deliberate, documented
## dev-only default meant to be overridden by an env var in production --
## see toleman-platform's own backend/app/core/config.py:34
## (`admin_password: str = DEFAULT_ADMIN_PASSWORD`) and its
## validate_production_secrets() at line 136, which refuses to start a
## non-local deployment still holding that default. That's an
## *assignment*, not a comparison, so the `==`-based patterns below can't
## match it directly. But config.py:151's own startup check
## (`if s.admin_password == DEFAULT_ADMIN_PASSWORD:`) DID trip this rule on
## the first real run, and it's worth recording exactly why: semgrep's
## constant propagation resolves `DEFAULT_ADMIN_PASSWORD` to its assigned
## literal ("changeme123") before pattern matching, so `$PLIT` bound to
## "changeme123" -- which contains "changeme" -- and the single-check
## sub-rule fired on a comparison whose source text has no string literal
## in it at all. That's the exact false-positive class this rule exists to
## avoid, reproduced by a different mechanism than the original
## `hardcoded-secret-assignment` bug. Fixed by adding
## `options: {constant_propagation: false}` to both sub-rules below, which
## makes them require an actual string literal at the comparison site.
## Third semgrep gotcha for this pack's README, alongside the
## metavariable-regex anchoring one: constant propagation is on by
## default and will silently resolve a named constant into any pattern
## that expects a literal, including through `metavariable-regex` checks.
##
## Validated 2026-09-12 (after the constant_propagation fix):
## - toleman-platform: true negative. config.py:151 confirmed NOT to match
##   post-fix. No other file does `<var> == "admin"/"password"/"changeme"/
##   "root"` style comparison (grepped).
## - pygoat: 3/3 TP for the compound-check sub-rule --
##   introduction/playground/A9/api.py:17, its duplicate (dead/unrouted
##   copy, not imported by urls.py, but still real matched source)
##   archive.py:17 (`if username == "admin" and password == "admin":`
##   inside a POST login handler routed live at introduction/urls.py:84 --
##   confirmed by reading the handler: on match it returns
##   {"message": "Loged in successfully"}, a real auth decision), and
##   introduction/views.py:833
##   (`elif username == 'admin' and password == 'admin_pass':` inside
##   a1_broken_access_lab_3, sets loggedin=True/admin=True on match). All
##   3 also matched by the single-check sub-rule (its pattern is a strict
##   subexpression of the compound one, so full overlap here is expected,
##   not a bug). Other hardcoded-credential checks in the same file
##   (jack/jacktheripper, John/reaper, User/P@$$w0rd) were correctly NOT
##   flagged -- none of their literals are in this rule's target set
##   (admin/password/changeme/root); admin_pass WAS flagged because it
##   contains "admin" as a substring, which is intended, not a bug.
## - dvpwa: true negative (SQLi-focused, no hardcoded-credential-comparison
##   pattern present).
rules:
  - id: toleman-hardcoded-default-credential-compound-check
    languages: [python]
    severity: ERROR
    confidence: MEDIUM
    message: >-
      An authentication check compares two fields directly against
      well-known default credential values (e.g. admin/admin,
      admin/password). Anyone who knows this is a hardcoded default check
      can log in without a real account (CWE-798: Use of Hard-coded
      Credentials, CWE-521: Weak Password Requirements).
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      validated-against:
        - "pygoat: 3/3 TP -- introduction/playground/A9/api.py:17 (live-routed login handler), archive.py:17 (dead-code duplicate), views.py:833 (a1_broken_access_lab_3)"
        - "toleman-platform: true negative (BaseSettings default correctly not re-flagged post constant_propagation fix, see header)"
        - "dvpwa: true negative"
    options:
      # Without this, semgrep's constant propagation resolves a named
      # constant (e.g. DEFAULT_ADMIN_PASSWORD = "changeme123") to its
      # literal value at every comparison site, so `s.admin_password ==
      # DEFAULT_ADMIN_PASSWORD` matches "$PLIT" == "changeme123" -- which
      # contains "changeme" -- and this rule re-flags the exact
      # BaseSettings startup-validation check it exists to NOT flag.
      # Caught this by hand on a first pass against toleman-platform's own
      # config.py:151 before fixing it; constant_propagation: false makes
      # the pattern require an actual string literal at the comparison
      # site, not a resolved reference.
      constant_propagation: false
    patterns:
      - pattern-either:
          - pattern: $UVAR == "$ULIT" and $PVAR == "$PLIT"
          - pattern: $PVAR == "$PLIT" and $UVAR == "$ULIT"
      - metavariable-regex:
          metavariable: $ULIT
          regex: (?i)^.*(admin|root).*$
      - metavariable-regex:
          metavariable: $PLIT
          regex: (?i)^.*(admin|password|changeme|root).*$

  - id: toleman-hardcoded-default-credential-single-check
    languages: [python]
    severity: WARNING
    confidence: LOW
    message: >-
      A variable whose name looks like a password/secret is compared
      directly against a well-known default value (admin/password/
      changeme/root). If this is a real auth or credential-reset check
      (rather than a test fixture or a BaseSettings field default), it's
      the same class of hardcoded-default bug as CWE-798 -- a human should
      confirm this isn't a config default being validated against its own
      constant.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      validated-against:
        - "pygoat: 3/3 TP, same 3 locations as the compound-check rule (this pattern is a strict subexpression of that one, so full overlap here is expected)"
        - "toleman-platform: true negative (see header)"
        - "dvpwa: true negative"
    options:
      # Same fix as the compound-check rule above: without this, constant
      # propagation resolves a named default constant (DEFAULT_ADMIN_PASSWORD
      # etc.) to its literal value and re-flags a BaseSettings
      # startup-validation comparison instead of a real auth check. Confirmed
      # this was a live bug, not a hypothetical: toleman-platform's own
      # config.py:151 (`s.admin_password == DEFAULT_ADMIN_PASSWORD`, which
      # resolves to "changeme123") tripped this rule on the first run before
      # the option was added.
      constant_propagation: false
    patterns:
      - pattern: $PVAR == "$PLIT"
      - metavariable-regex:
          metavariable: $PVAR
          regex: (?i)^.*(password|passwd|pwd|secret).*$
      - metavariable-regex:
          metavariable: $PLIT
          regex: (?i)^.*(admin|password|changeme|root).*$
