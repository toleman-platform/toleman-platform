# Production override: adds a Caddy reverse proxy in front of the frontend
# and backend, terminating TLS with a Cloudflare Origin CA certificate (see
# deploy/README.md). Use alongside docker-compose.yml and, on amd64 hosts
# where you want prebuilt images, docker-compose.ghcr.yml:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# On arm64 (e.g. Oracle Cloud Ampere A1), omit docker-compose.ghcr.yml -- the
# published `edge` image is amd64-only, so build from source instead (the
# command above already does this via --build).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
