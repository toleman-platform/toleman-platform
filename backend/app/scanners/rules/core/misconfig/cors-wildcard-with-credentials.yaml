## CORS wildcard + credentials (CWE-942).
##
## REGRESSION NOTE (2026-09-12): validated (written, 0/0/0 unproven) this
## session but never persisted to this directory until now; see
## injection/code-and-command-injection.yaml's header for the full story.
##
## 0/0/0 across toleman/pygoat/dvpwa -- none of the 3 configure CORS with
## both a wildcard origin and credentials enabled. Kept LOW/unproven.
rules:
  - id: toleman-cors-wildcard-with-credentials
    languages: [python]
    severity: ERROR
    confidence: LOW
    message: >-
      CORS is configured with a wildcard/reflected origin AND credentials
      allowed -- this lets any website read authenticated responses from a
      logged-in victim's browser (CWE-942).
    metadata:
      category: security
      cwe: "CWE-942: Overly Permissive Cross-domain Whitelist"
      validated-against: []
    patterns:
      - pattern: CORSMiddleware(..., allow_origins=$ORIGINS, ..., allow_credentials=True, ...)
      - metavariable-regex:
          metavariable: $ORIGINS
          regex: (?s).*\*.*
