name: Frontend Unit Tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test

      # Issue #206: the custom ESLint rule that blocks a Server Component
      # importing a value out of a "use client" module. Run explicitly --
      # its fixtures contain the violation on purpose and are ignored by the
      # normal lint pass.
      - name: Test custom lint rules
        run: npm run test:lint-rules

      - name: Enforce client/server boundary
        run: npm run lint:boundary

      - name: Build (also generates Next.js route types and type-checks)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
