apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toleman.fullname" . }}-backend
  labels:
    {{- include "toleman.componentLabels" (merge (dict "component" "backend") .) | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "toleman.componentLabels" (merge (dict "component" "backend") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "toleman.componentLabels" (merge (dict "component" "backend") .) | nindent 8 }}
    spec:
      {{- if .Values.postgres.enabled }}
      # Mirrors docker-compose.yml's `depends_on: condition: service_healthy`:
      # without this, the backend Pod starts before Postgres accepts
      # connections, and init_db()'s `alembic upgrade head` (app/main.py's
      # lifespan) fails the container's very first start, CrashLoopBackOff-ing
      # at least once before Kubernetes' own restart backoff happens to land
      # after Postgres is ready. Multiple backend replicas racing
      # init_db() concurrently once Postgres *is* up is a separate, already
      # solved problem (#296's pg_advisory_lock in app/core/db.py).
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "toleman.fullname" . }}-postgres 5432; do echo waiting for postgres; sleep 2; done
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.image.backendRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "toleman.fullname" . }}-config
            - secretRef:
                name: {{ include "toleman.secretName" . }}
          # Same endpoint docker-compose.yml's backend healthcheck uses
          # (curl against /health); see app/main.py's health() for what it
          # reports (build identity + DB identity, no auth required).
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "toleman.fullname" . }}-backend
  labels:
    {{- include "toleman.componentLabels" (merge (dict "component" "backend") .) | nindent 4 }}
spec:
  selector:
    {{- include "toleman.componentLabels" (merge (dict "component" "backend") .) | nindent 4 }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
