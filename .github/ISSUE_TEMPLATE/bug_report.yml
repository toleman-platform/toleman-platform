name: Bug report
description: Something in Toleman isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If this is a **security vulnerability**
        (something that could let an attacker do something they shouldn't),
        please don't file it here — use the private reporting flow in
        [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        I ran a scan against ... and expected ..., but instead ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that reproduces it.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - Backend API
        - Celery worker / scan execution
        - Frontend
        - MCP server
        - PR Guardrail
        - GitHub App integration
        - Docker Compose / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: A commit SHA, an image tag (`edge`, `sha-...`), or "built from main on <date>".
      placeholder: sha-abc1234
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: How you're running Toleman (Docker Compose, manual setup, OS) and anything non-default in your `.env`.
      placeholder: |
        Docker Compose quickstart, macOS 14, Docker Desktop 4.x
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Backend/Celery/frontend logs, a stack trace, a screenshot. This is rendered as-is, so wrap it in a code block. Redact anything sensitive first (tokens, real repo URLs, etc).
      render: shell
    validations:
      required: false
