{{- if not .Values.secrets.existingSecret }}
{{- $isProd := ne .Values.config.environment "local" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toleman.fullname" . }}-app-secrets
  labels:
    {{- include "toleman.labels" . | nindent 4 }}
type: Opaque
stringData:
  # See app/core/config.py: SESSION_SECRET/ADMIN_PASSWORD/
  # PLATFORM_ENCRYPTION_KEY only matter once config.environment isn't
  # "local" -- validate_production_secrets() itself only catches the first
  # two (it checks against its own hardcoded default values, not
  # "is this empty"), and an empty PLATFORM_ENCRYPTION_KEY isn't rejected
  # by the app at all: it silently falls back to a fresh key generated
  # per-process (app/core/crypto.py), invalidating every encrypted secret
  # on every restart. `required` below fails the chart render instead of
  # letting either ship silently for a non-local install; local (the
  # zero-config try-it-out case) keeps working with these left blank.
{{- if $isProd }}
  SESSION_SECRET: {{ required "secrets.sessionSecret must be set when config.environment is not \"local\"" .Values.secrets.sessionSecret | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword must be set when config.environment is not \"local\"" .Values.secrets.adminPassword | quote }}
  PLATFORM_ENCRYPTION_KEY: {{ required "secrets.platformEncryptionKey must be set when config.environment is not \"local\"" .Values.secrets.platformEncryptionKey | quote }}
{{- else }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  PLATFORM_ENCRYPTION_KEY: {{ .Values.secrets.platformEncryptionKey | quote }}
{{- end }}
  # DATABASE_URL/REDIS_URL/WORKSPACE_API_KEY/ANTHROPIC_API_KEY: moved here
  # (out of templates/configmap.yaml) because a Kubernetes RBAC role can
  # grant read access to ConfigMaps without granting it for Secrets, and
  # DATABASE_URL always embeds the postgres password. Bringing your own
  # Secret via secrets.existingSecret must include these four keys too, not
  # just SESSION_SECRET/ADMIN_PASSWORD/PLATFORM_ENCRYPTION_KEY -- see
  # templates/NOTES.txt.
  DATABASE_URL: {{ include "toleman.databaseUrl" . | quote }}
  REDIS_URL: {{ include "toleman.redisUrl" . | quote }}
  WORKSPACE_API_KEY: {{ .Values.config.workspaceApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.config.anthropicApiKey | quote }}
  {{- if .Values.postgres.enabled }}
  # Consumed by templates/postgres.yaml's own StatefulSet env (not via
  # envFrom like the backend/celery-worker, since the Postgres image
  # expects these two specific var names) rather than by the app itself.
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  {{- if and $isProd (or (not .Values.postgres.password) (eq .Values.postgres.password "toleman")) }}
  {{ fail "postgres.password must be set to a real, non-default value when config.environment is not \"local\" - the chart's own default (\"toleman\") is documented in values.yaml, so leaving it means anything that can reach the bundled Postgres Service already has its password" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
