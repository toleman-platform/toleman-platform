name: CI

# The gating jobs: what has to pass before a change is trustworthy.
#
# History worth keeping: these lived here, moved to CircleCI in #236 because
# Actions minutes ran out twice, and came back in #333 when the move to the
# toleman-platform org left the CircleCI project bound to the old
# geekshiv/rikugan-platform path and nothing reported on #332 at all. They
# stay here for good now; GitHub Actions has no minute limit on standard
# runners for public repositories, which is what made CircleCI necessary in
# the first place.
#
# The heavier jobs are split out by cost of a different kind (run duration
# rather than billed minutes) into self-scan.yml and docker-images.yml.
#
# Note for outside contributions: GitHub does not expose repository secrets
# to workflows triggered by a pull request from a fork, and `pull_request`
# (rather than `pull_request_target`) runs the workflow from the fork's own
# ref with a read-only token. Neither is a setting to maintain; both are the
# default and both matter for a security product accepting public PRs. Do
# not switch this to pull_request_target to "fix" a permissions error.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default for every job below: none of them push commits,
# comment, or touch releases/packages, they only check out the repo, build,
# and run tests/smoke checks. Explicit rather than relying on the repo's
# default token permissions, which can be broader than this workflow needs
# (flagged by zizmor's excessive-permissions check).
permissions:
  contents: read

# (#233) A force-push during review should not leave a superseded run
# occupying a runner and reporting a result nobody will act on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Throwaway per-run services. The credentials are fixed only so the
      # DATABASE_URL below matches; nothing persists past the job.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toleman
          POSTGRES_PASSWORD: toleman
          POSTGRES_DB: toleman
        options: >-
          --health-cmd "pg_isready -U toleman -d toleman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://toleman:toleman@localhost:5432/toleman
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: python -m pytest -v --junitxml=test-results/pytest.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results/pytest.xml

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test

      # The custom ESLint rule that blocks a Server Component importing a
      # value out of a "use client" module (#206). Run explicitly; its
      # fixtures contain the violation on purpose and the normal lint pass
      # ignores them.
      - name: Test custom lint rules
        run: npm run test:lint-rules

      # --max-warnings=0 is deliberate: the tree is at zero, and warnings
      # allowed to accumulate stop being read.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build (also generates Next.js route types and type-checks)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  mcp-server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    env:
      TOLEMAN_API_TOKEN: toleman_pat_test
      TOLEMAN_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v --junitxml=test-results/pytest.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-server-test-results
          path: mcp-server/test-results/pytest.xml

  compose-config:
    # Cheap and fast: catches a compose file referencing a service, image or
    # build context that does not exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      # The GHCR override is a separate file nothing else exercises, so
      # without this a service renamed in the base compose file would leave
      # it silently overriding a service that no longer exists.
      - name: Validate the GHCR override composes onto it
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml config --quiet
          # Every service this override names must actually resolve to a
          # GHCR image; a typo'd service key is otherwise a no-op that only
          # shows up as an unexpected local build at someone else's `up`.
          for svc in backend celery-worker frontend; do
            image=$(docker compose -f docker-compose.yml -f docker-compose.ghcr.yml \
                      config --format json | python3 -c "
          import json,sys
          print(json.load(sys.stdin)['services']['$svc']['image'])")
            case "$image" in
              ghcr.io/*) echo "ok  $svc -> $image" ;;
              *) echo "FAIL $svc resolved to '$image', expected a ghcr.io image" >&2; exit 1 ;;
            esac
          done

  compose-up-smoke-test:
    # #293: verify the platform actually runs on a plain VM, not just that
    # docker-compose.yml parses (compose-config above) and that each image
    # builds in isolation (docker-images.yml). Neither of those starts the
    # containers together, so nothing had ever proven postgres, redis,
    # backend, celery-worker and frontend actually come up and talk to each
    # other. A GitHub-hosted `ubuntu-latest` runner is exactly the "plain
    # VM" case: no Docker Desktop, no pre-pulled layers, real network egress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the full stack
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Wait for all five services to be up and healthy
        # docker-compose.yml already defines healthchecks for postgres,
        # redis and backend; `docker compose ps` surfaces them without
        # re-implementing the polling logic that would just be a worse copy
        # of the healthcheck config.
        #
        # --all is load-bearing, not decoration: without it, `ps` omits any
        # exited container entirely, so a celery-worker that crashed on
        # startup would simply not appear in the output instead of showing
        # up as unhealthy or stopped, an earlier version of this check
        # verified the *absence* of "unhealthy" among whatever containers
        # happened to still be listed, which a silently-dead celery-worker
        # would have passed.
        run: |
          for i in $(seq 1 60); do
            # The assignment must be the direct condition of this `if` (not
            # a plain `check_output=$(...)` line followed by `status=$?`):
            # GitHub Actions runs `run:` steps under `bash -e`, and a nonzero
            # command-substitution assignment aborts the script immediately
            # under errexit, before a following `status=$?` line ever
            # executes. That would have quietly turned "not yet healthy"
            # (this loop's normal, expected first few iterations) into an
            # immediate hard failure instead of a retry. A command that is
            # the direct condition of `if` is exempt from errexit, which is
            # what actually lets `status=2` reach the branch below.
            if check_output="$(docker compose ps --all --format json | python3 -c "
          import json, sys

          expected = {'postgres', 'redis', 'backend', 'celery-worker', 'frontend'}
          must_be_healthy = {'postgres', 'redis', 'backend'}
          rows = {row['Service']: row for row in
                  (json.loads(line) for line in sys.stdin if line.strip())}

          missing = expected - rows.keys()
          if missing:
              print('missing services:', ', '.join(sorted(missing)))
              sys.exit(1)

          not_running = [name for name, row in rows.items() if row.get('State') != 'running']
          if not_running:
              print('not running:', ', '.join(sorted(not_running)))
              sys.exit(1)

          unhealthy = [name for name in must_be_healthy if rows[name].get('Health') != 'healthy']
          if unhealthy:
              print('not yet healthy:', ', '.join(sorted(unhealthy)))
              sys.exit(2)

          print('all five services running, postgres/redis/backend healthy')
          ")"; then
              status=0
            else
              status=$?
            fi
            echo "$check_output"
            if [ "$status" -eq 0 ]; then
              break
            elif [ "$status" -eq 1 ]; then
              # Missing or not-running is never transient once compose has
              # finished starting containers: something actually crashed
              # (or was never defined), not "still starting up".
              docker compose ps --all
              exit 1
            fi
            # status 2: present and running, just not healthy yet -- keep polling.
            if [ "$i" -eq 60 ]; then
              echo "timed out waiting for postgres/redis/backend to report healthy" >&2
              docker compose ps --all
              exit 1
            fi
            sleep 5
          done

          # A separate, un-retried loop here was the bug in an earlier version
          # of this fix: postgres/redis/backend can all turn "healthy" (backend's
          # own healthcheck only proves *it* is serving) well before frontend's
          # Next.js server has actually bound its port, since frontend has no
          # healthcheck of its own for the loop above to wait on. A single curl
          # attempt right after breaking out of that loop raced frontend's
          # listener and failed the job even though the stack was fine seconds
          # later. Retrying here, with the same budget as the health loop
          # above, is what actually waits for frontend instead of assuming
          # "containers healthy" means "HTTP is up".
          # --max-time bounds each individual attempt: curl has no transfer
          # timeout by default, so a service that accepts the TCP connection
          # but never sends a response would otherwise block this step (and
          # the teardown steps after it) indefinitely instead of failing
          # within the ~5-minute budget this loop is supposed to enforce.
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:8000/health >/dev/null && curl -sf --max-time 5 http://localhost:3000 >/dev/null; then
              echo "backend and frontend are both responding"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "timed out waiting for backend/frontend HTTP endpoints to respond" >&2
              docker compose ps --all
              exit 1
            fi
            sleep 5
          done

      - name: Verify backend health payload
        run: curl -sf --max-time 5 http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
