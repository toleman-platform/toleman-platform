name: Frontend Unit Tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"

# Cancel a superseded run when a branch is pushed again. Without this, every
# amend or force-push during review pays for a full duplicate run of every job
# below -- the previous run keeps going to completion even though its result
# can no longer matter.
#
# `github.ref` is the group key, so pushes to the *same* branch cancel each
# other while different PRs stay independent. main is excluded from
# cancellation via `github.run_id` in the fallback: a push to main should
# always finish, since its result is what the branch protection and the
# post-merge image build rely on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test

      # Issue #206: the custom ESLint rule that blocks a Server Component
      # importing a value out of a "use client" module. Run explicitly --
      # its fixtures contain the violation on purpose and are ignored by the
      # normal lint pass.
      - name: Test custom lint rules
        run: npm run test:lint-rules

      # The full lint pass gates the build now that the 23 pre-existing
      # errors are gone. `lint:boundary` was the narrower gate that existed
      # only because a blanket one could not pass; it is redundant here, since
      # this pass runs the boundary rule too.
      #
      # --max-warnings=0 is deliberate: the tree is at zero, and warnings that
      # are allowed to accumulate stop being read.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build (also generates Next.js route types and type-checks)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
