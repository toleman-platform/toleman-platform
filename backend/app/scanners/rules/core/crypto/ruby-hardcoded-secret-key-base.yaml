## Hardcoded Rails secret_key_base / app secret (CWE-798), Ruby on Rails.
##
## `secret_key_base` signs and encrypts every Rails session cookie and CSRF
## token app-wide; anyone who reads it out of source control can forge a
## signed session cookie for any user, or decrypt an encrypted cookie
## store. Rails' own generator always emits this file with the key read
## from ENV["SECRET_KEY_BASE"] (or, on Rails 5.2+, config/credentials.yml.enc
## via Rails.application.credentials.secret_key_base) specifically so it
## is never committed -- a literal string here is a deviation from the
## framework default, not incidental.
##
## Deliberately scoped to secret_key_base/secret_token-shaped config
## assignments only, not general "password"-named variables -- this pack's
## Python `toleman-hardcoded-encryption-key-or-iv-assignment` rule hit a
## 100% false-positive rate on an earlier, broader version of itself
## (flagging every Settings(BaseSettings) field default, which are
## documented dev-only fallbacks meant to be overridden by env vars, not
## real hardcoded secrets -- see that file's own header). The Rails
## equivalent of "meant to be externally supplied" is ENV[...] and
## Rails.application.credentials.*; both are excluded below so a codebase
## doing it correctly doesn't get flagged for merely mentioning the key
## name.
##
## Validated 2026-09-12 against RailsGoat (scratchpad/railsgoat).
##
## `toleman-ruby-hardcoded-secret-key-base`: 1/1 true positive --
## config/initializers/secret_token.rb:8:
##   Railsgoat::Application.config.secret_key_base = "2f1d90a26236c3245d96f5606c201a780dc9ca687e5ed82b45e211bb5dc84c1870f61ca9e002dad5dd8a149c9792d8f07f31a9575065cca064bd6af44f8750e4"
## A 128-hex-char literal (this is exactly what `rails secret` generates)
## assigned directly to config.secret_key_base, checked into source
## control -- not an ENV[...] read, not a credentials.yml.enc reference.
## Confirmed no other assignment to this config key exists anywhere else in
## the app that might override it at runtime.
rules:
  - id: toleman-ruby-hardcoded-secret-key-base
    languages: [ruby]
    severity: ERROR
    confidence: MEDIUM
    message: >-
      A literal string is assigned directly to secret_key_base (or a
      similarly-named app-wide secret/secret_token config value) instead of
      being read from ENV or Rails credentials (CWE-798). This key signs
      and encrypts every session cookie and CSRF token application-wide --
      anyone with read access to source control can forge a valid signed
      session for any user. Use ENV["SECRET_KEY_BASE"] or
      Rails.application.credentials.secret_key_base instead, and rotate
      this value since it is now public.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      references:
        - "https://guides.rubyonrails.org/security.html#custom-credentials"
      validated-against:
        - "railsgoat: 1/1 true positive (config/initializers/secret_token.rb:8, config.secret_key_base = \"<128-hex-char literal>\")"
    patterns:
      - pattern-either:
          - pattern: $CFG.config.secret_key_base = "..."
          - pattern: $CFG.secret_key_base = "..."
          - pattern: $CFG.config.secret_token = "..."
