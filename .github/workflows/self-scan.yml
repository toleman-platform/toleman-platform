name: Self Scan (dogfooding)

# Runs the same open-source tools Rikugan wraps (Semgrep, Gitleaks, Trivy) against
# this repo itself. Results go to workflow artifacts + the job summary, not
# GitHub code scanning: SARIF-to-Security-tab upload requires GitHub Advanced
# Security, which isn't available on private repos on this plan (confirmed by
# a real failed run - "Code scanning is not enabled for this repository").
# Also can't push to our own Rikugan backend from here: it's local-dev-only and
# unreachable from GitHub's cloud runners. gosec is intentionally excluded:
# it's Go-specific and this repo has no Go source.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        # `setuptools<81` for the same reason as backend/Dockerfile: semgrep's
        # pinned opentelemetry-instrumentation imports `pkg_resources`, which
        # setuptools removed in 82.0.0 (and deprecated in 81). Latent here rather than currently
        # broken -- the runner image ships an older setuptools today -- but it
        # breaks the moment that image updates, and a silently broken security
        # scan is worse than a loud one.
        run: pip install semgrep "setuptools<81"
      - name: Run Semgrep
        run: semgrep scan --config=auto --json --output=semgrep.json || true
      - name: Summarize
        run: |
          echo "## Semgrep" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json
          d = json.load(open('semgrep.json'))
          results = d.get('results', [])
          with open('$GITHUB_STEP_SUMMARY', 'a') as f:
              f.write(f'{len(results)} findings\n\n')
              for r in results[:20]:
                  f.write(f\"- **{r['extra']['severity']}** {r['check_id']}: {r['path']}:{r['start']['line']}\n\")
          "
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep.json

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Run Gitleaks
        run: |
          ./gitleaks detect --report-format json --report-path gitleaks.json --no-git --exit-code 0
          echo "## Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json
          d = json.load(open('gitleaks.json'))
          with open('$GITHUB_STEP_SUMMARY', 'a') as f:
              f.write(f'{len(d)} findings\n\n')
              for r in d[:20]:
                  f.write(f\"- {r['RuleID']}: {r['File']}:{r['StartLine']}\n\")
          "
      - uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks.json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: json
          output: trivy.json
          scan-ref: .
      - name: Summarize
        run: |
          echo "## Trivy" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json
          d = json.load(open('trivy.json'))
          count = sum(len(r.get('Vulnerabilities') or []) + len(r.get('Misconfigurations') or []) for r in d.get('Results', []))
          with open('$GITHUB_STEP_SUMMARY', 'a') as f:
              f.write(f'{count} findings across {len(d.get(\"Results\", []))} targets\n')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy.json
