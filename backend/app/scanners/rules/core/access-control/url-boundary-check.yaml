## Substring-based URL/host validation used where a real boundary check
## belongs (CWE-20). "https://good.com".startswith is also true of
## "https://good.com.evil.com"; "good.com".endswith is also true of
## "evil-good.com".
##
## Validated 2026-09-12 against toleman-platform: found the exact CodeQL
## alert "Incomplete URL substring sanitization" at
## backend/tests/test_github_app_manifest.py:54,111 -- and confirmed by
## reading it that this specific instance is a false positive *in context*:
## it's a test assertion on a manifest-builder's output, not a live
## security check, so there's nothing here an attacker can reach. Kept in
## the pack anyway (as LOW confidence, flag-for-triage) because the same
## generic pattern also surfaced 2 more candidates elsewhere in the same
## repo (backend/app/core/github.py:9, backend/app/scanners/runner.py:636)
## that were NOT manually verified -- this rule's job is triage, and "the
## one ground-truth instance we checked turned out benign" is itself
## useful data for how much to trust its other hits, not a reason to drop
## it.
rules:
  - id: toleman-url-startswith-check-used-as-validation
    languages: [python]
    severity: WARNING
    confidence: LOW
    message: >-
      startswith() against a URL/host string is a substring check, not a
      real host-boundary check -- "https://good.com" also matches
      "https://good.com.evil.com". If this is validating trust (not just a
      test assertion), use urlparse().netloc equality instead.
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"
      validated-against:
        - "toleman-platform (self): found the real CodeQL alert; manual review found it benign in this specific instance (test assertion, not a live check) -- flag rate matches expectation for a LOW-confidence heuristic"
    patterns:
      - pattern: $URL.startswith($PREFIX)
      - metavariable-regex:
          metavariable: $PREFIX
          regex: (?i).*://.*

  - id: toleman-url-endswith-check-used-as-validation
    languages: [python]
    severity: WARNING
    confidence: LOW
    message: >-
      endswith() against a host/domain string is a substring check, not a
      real boundary check -- "evil-good.com" also matches
      endswith("good.com"). Use urlparse().netloc equality or a
      leading-dot check instead.
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"
      validated-against:
        - "toleman-platform (self): 2 unverified candidates, not manually confirmed"
    patterns:
      - pattern: $URL.endswith($SUFFIX)
      - metavariable-regex:
          metavariable: $SUFFIX
          regex: (?i).*\..*[a-z]{2,}.*
