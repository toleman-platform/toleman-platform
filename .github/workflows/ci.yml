name: CI

# TEMPORARY: restores PR gating on GitHub-hosted runners while the CircleCI
# project is re-linked to this repository. CI moved to CircleCI in #236
# because Actions minutes ran out; the org move to `toleman-platform` left
# the CircleCI project bound to the old `geekshiv/rikugan-platform` path, so
# no job reported on the rename PR and main merged unverified.
#
# .circleci/config.yml is deliberately left in place and unmodified -- it is
# the intended home for these jobs. Once the CircleCI project is re-linked,
# delete this file rather than maintaining two copies that can drift.
#
# Only the gating jobs live here. The dogfooding scans and image builds are
# in self-scan.yml and docker-images.yml, off the per-PR path, because they
# are what consumed the Actions budget the first two times (measured in
# .circleci/config.yml: self-scan 76 min/run against backend+frontend tests
# at 70 min combined).

on:
  pull_request:
  push:
    branches: [main]

# (#233) A force-push during review should not keep paying for a run whose
# result can no longer matter.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same images and credentials as the CircleCI job, so a failure here
      # means what it means there.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toleman
          POSTGRES_PASSWORD: toleman
          POSTGRES_DB: toleman
        options: >-
          --health-cmd "pg_isready -U toleman -d toleman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://toleman:toleman@localhost:5432/toleman
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: python -m pytest -v --junitxml=test-results/pytest.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results/pytest.xml

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test

      # The custom ESLint rule that blocks a Server Component importing a
      # value out of a "use client" module (#206). Run explicitly -- its
      # fixtures contain the violation on purpose and the normal lint pass
      # ignores them.
      - name: Test custom lint rules
        run: npm run test:lint-rules

      # --max-warnings=0 is deliberate: the tree is at zero, and warnings
      # allowed to accumulate stop being read.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build (also generates Next.js route types and type-checks)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  mcp-server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    env:
      TOLEMAN_API_TOKEN: toleman_pat_test
      TOLEMAN_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v --junitxml=test-results/pytest.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-server-test-results
          path: mcp-server/test-results/pytest.xml

  compose-config:
    # Cheap and fast: catches a compose file referencing a service, image or
    # build context that does not exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
