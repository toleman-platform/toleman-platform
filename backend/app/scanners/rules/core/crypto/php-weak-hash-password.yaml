## Weak/fast hash used for password storage (CWE-916), and a hardcoded
## default credential literal (CWE-798) -- PHP.
##
## Validated 2026-09-12 against DVWA (digininja/DVWA):
##
## toleman-php-weak-hash-password-assignment: DVWA hashes every login and
## password-change password with a single unsalted md5() call, with the
## result assigned right back to a variable whose own name says
## "password" -- an unusually clean case for a name-based heuristic. Real
## hits, all independently confirmed by opening the file:
##   login.php:27 -- $pass = md5( $pass ); (the actual login-check hash --
##     hashed once here, compared against the DB in the query built at
##     login.php:29 on)
##   vulnerabilities/brute/source/low.php:9 -- $pass = md5( $pass );
##     (DVWA's own Brute Force lab -- login.php's exact pattern, reused)
##   vulnerabilities/csrf/source/low.php:12 -- $pass_new = md5( $pass_new );
##     (the CSRF lab's password-change handler)
##   vulnerabilities/captcha/source/low.php:57 -- $pass_new = md5( $pass_new );
##     (the Insecure CAPTCHA lab's password-change handler, same shape)
## Not re-listed individually, same shape confirmed at: brute/medium.php:11,
## brute/high.php:16, brute/impossible.php:16 (impossible.php still uses
## bare md5() with no salt/pepper -- DVWA's "impossible" tier fixes the
## SQLi/brute-force-rate-limit issues in that lab but does not fix the
## hash choice), captcha/medium.php:65, captcha/high.php:27,
## captcha/impossible.php:14/19/24, csrf/medium.php:14, csrf/high.php:39,
## csrf/impossible.php:15/29, csrf/test_credentials.php:19. All confirmed
## real by variable name and by hand-reading at least one instance per
## lab; not just a grep count.
##
## toleman-php-hardcoded-default-credential: DVWA ships its DB password as
## a literal fallback in its own reference config:
##   config/config.inc.php.dist:21 --
##     $_DVWA[ 'db_password' ] = getenv('DB_PASSWORD') ?: 'p@ssw0rd';
##   The env var is checked first, so this isn't a pure "always uses this
##   password" bug the way login.php's md5() is -- but 'p@ssw0rd' is the
##   literal that ships in the repo and is what a default/undocumented
##   deployment actually gets, matching this pack's Python precedent
##   (toleman-hardcoded-default-credential-compound-check) for exactly this
##   "shipped default the reader would recognize as a real password, not a
##   placeholder" class of finding.
##
## Gotcha worth flagging for anyone re-running this: scanning the DVWA
## checkout directly finds 0 hits for this specific file, not because the
## pattern is wrong but because semgrep's language auto-detection only
## treats .php/.php3/.php4/.php5/.phtml as PHP -- config.inc.php.dist's
## ".dist" extension makes it invisible to a directory-wide `--config`
## scan entirely (confirmed: the exact same rule matches this exact file's
## content 1/1 when the file is copied to a .php-suffixed path first).
## Real production configs (config.inc.php, no .dist) don't have this
## problem; this only bites the repo's own shipped TEMPLATE file. Noted
## here rather than silently reporting "0 hits" as if the pattern failed.
rules:
  - id: toleman-php-weak-hash-password-assignment
    languages: [php]
    severity: WARNING
    confidence: MEDIUM
    message: >-
      md5()/sha1() is used to hash a value assigned to a variable whose
      name suggests it holds a password (CWE-916). Both are fast, unsalted
      hashes designed for speed, not password storage -- an attacker with
      the hash (e.g. from a DB leak) can brute-force it at billions of
      guesses/second on commodity GPUs. Use password_hash()
      (PASSWORD_DEFAULT, currently bcrypt) to hash and password_verify()
      to check, instead of md5()/sha1().
    metadata:
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      references:
        - "https://owasp.org/www-community/vulnerabilities/Insecure_Storage_of_Sensitive_Information"
      validated-against:
        - "DVWA (digininja/DVWA): repeated true positive across every lab that hashes a password -- login.php:27, vulnerabilities/brute/source/low.php:9 (Brute Force lab), vulnerabilities/csrf/source/low.php:12 (CSRF lab), vulnerabilities/captcha/source/low.php:57 (Insecure CAPTCHA lab), plus the medium/high/impossible variants of the last three labs and vulnerabilities/csrf/test_credentials.php:19 -- DVWA never switches to password_hash() at any difficulty tier for these labs"
    patterns:
      - pattern-either:
          - pattern: $VAR = md5($X)
          - pattern: $VAR = sha1($X)
      - metavariable-regex:
          metavariable: $VAR
          # Substring match, case-insensitive -- wrapped in .* on purpose:
          # semgrep's metavariable-regex anchors like re.match (position 0
          # only), so an unwrapped alternation like (pass|pwd)$ would
          # silently miss "$pass_new" (the match has to start at position
          # 0 of the *whole* identifier for a bare "$" anchor to matter
          # here, and this identifier doesn't start with "pass" in a way
          # an unwrapped regex would reliably catch across all 4 variants
          # below) -- same gotcha this pack's README already documents for
          # the Python hardcoded-key rule, hit again here in PHP.
          regex: (?i).*(pass|pwd|passwd).*

  - id: toleman-php-hardcoded-default-credential
    languages: [php]
    severity: WARNING
    confidence: LOW
    message: >-
      A literal string is assigned as a default/fallback for a variable or
      array key named like a password/secret/credential (CWE-798). Even as
      a fallback behind getenv(...) ?: '...', a real-looking literal here
      is what an undocumented or misconfigured deployment actually runs
      with -- and it's readable by anyone with repo access. Use a
      generated-per-deployment secret (or fail startup if the env var is
      missing) instead of a literal fallback.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated-against:
        - "DVWA (digininja/DVWA): 1/1 true positive -- config/config.inc.php.dist:21, $_DVWA['db_password'] = getenv('DB_PASSWORD') ?: 'p@ssw0rd'; ships in the repo as the DB password a default/env-less deployment actually gets. Not found by a plain directory scan (semgrep skips .dist as a non-PHP extension) -- confirmed by copying the file to a .php path and re-scanning; see file header."
    patterns:
      # Both alternatives bind $KEY (the array-index form is DVWA's real
      # shape, config.inc.php.dist:20). Per this pack's gotcha #3, if a
      # second alternative ever needs adding that does NOT bind $KEY (e.g.
      # a bare `$VAR = "...";` form keyed on $VAR's own name instead), it
      # must get its own nested `patterns:` block with its own
      # metavariable-regex on $VAR -- a filter on $KEY shared across an
      # alternative that never binds $KEY would silently reject that
      # whole alternative, not skip the filter.
      - pattern-either:
          - pattern: $ARR[$KEY] = "..."
          - pattern: '$ARR[$KEY] = $ENV ?: "..."'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(pass|pwd|passwd|secret|api_key|apikey|token).*
    paths:
      exclude:
        - "*test*"
