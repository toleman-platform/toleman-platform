name: Backend Unit Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

# Cancel a superseded run when a branch is pushed again. Without this, every
# amend or force-push during review pays for a full duplicate run of every job
# below -- the previous run keeps going to completion even though its result
# can no longer matter.
#
# `github.ref` is the group key, so pushes to the *same* branch cancel each
# other while different PRs stay independent. main is excluded from
# cancellation via `github.run_id` in the fallback: a push to main should
# always finish, since its result is what the branch protection and the
# post-merge image build rely on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rikugan
          POSTGRES_PASSWORD: rikugan
          POSTGRES_DB: rikugan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://rikugan:rikugan@localhost:5432/rikugan
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v
