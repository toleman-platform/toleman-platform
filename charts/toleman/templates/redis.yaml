{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toleman.fullname" . }}-redis
  labels:
    {{- include "toleman.componentLabels" (merge (dict "component" "redis") .) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "toleman.componentLabels" (merge (dict "component" "redis") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "toleman.componentLabels" (merge (dict "component" "redis") .) | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "toleman.fullname" . }}-redis
  labels:
    {{- include "toleman.componentLabels" (merge (dict "component" "redis") .) | nindent 4 }}
spec:
  selector:
    {{- include "toleman.componentLabels" (merge (dict "component" "redis") .) | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
