## Sensitive value stored in localStorage/sessionStorage (CWE-922).
##
## Validated 2026-09-12 against toleman-platform's real frontend: 2
## real localStorage.setItem() call sites exist (density-toggle.tsx:59,
## theme-toggle.tsx:45), both correctly true-negative -- both store a UI
## preference under a plain `STORAGE_KEY` constant that doesn't match any
## sensitive-keyword pattern, confirmed by reading both files directly.
## pygoat/dvpwa: no frontend JS with this shape to test against.
##
## Browser storage (unlike an httpOnly cookie) is readable by any JS
## running on the page -- a single XSS anywhere becomes a full session/
## credential theft if a token lives here instead of in a cookie.
rules:
  - id: toleman-sensitive-value-in-web-storage
    languages: [javascript, typescript]
    severity: WARNING
    confidence: LOW
    message: >-
      A token/session/credential-shaped key is written to
      localStorage/sessionStorage. Unlike an httpOnly cookie, any JavaScript
      running on the page (including injected via an unrelated XSS bug) can
      read this value (CWE-922). Prefer an httpOnly, Secure cookie for
      anything security-sensitive.
    metadata:
      category: security
      cwe: "CWE-922: Insecure Storage of Sensitive Information"
      validated-against:
        - "toleman-platform: 2 real call sites checked, both true negative (UI preference under a non-sensitive key name)"
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($KEY, ...)
          - pattern: sessionStorage.setItem($KEY, ...)
          - pattern: window.localStorage.setItem($KEY, ...)
          - pattern: window.sessionStorage.setItem($KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|session|password|passwd|secret|api_?key|auth|credential).*
