## Hardcoded secret string assignment (CWE-798) -- Python.
##
## REGRESSION NOTE (2026-09-12): validated this session but never
## persisted to this directory until now; see
## injection/code-and-command-injection.yaml's header for the full story.
##
## First version had a 7/7 false-positive rate on toleman-platform: it
## flagged Pydantic BaseSettings field defaults explicitly documented as
## "known insecure defaults for local dev, overridden via env vars in
## production" (backend/app/core/config.py). Fixed with three exclusions:
## a `class $C(BaseSettings): ...` scope exclusion, a `DEFAULT_`-prefix
## name exclusion (module-level fallback constants referenced BY those
## Settings fields), and an empty-string-literal exclusion (a `""` default
## can never itself be a real hardcoded credential). After the fix:
## toleman-platform 0/0 -- confirmed clean, not just re-tuned to hide the
## same problem. pygoat/dvpwa: 0/0/0, no bare `$VAR = "literal"` credential
## assignment shape in either (their hardcoded secrets are all in different
## shapes -- SECRET_KEY = literal caught by the separate
## hardcoded-encryption-key-or-iv rule, not this one).
rules:
  - id: toleman-hardcoded-secret-assignment
    languages: [python]
    severity: WARNING
    confidence: LOW
    message: >-
      A variable named like a credential (password/secret/api_key/token) is
      assigned a hardcoded string literal, not read from env/vault/config.
      Anyone with source access has this credential (CWE-798).
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      validated-against:
        - "toleman-platform: fixed a 7/7 false-positive rate (BaseSettings/DEFAULT_ constant/empty-string exclusions); now 0/0 confirmed clean"
    patterns:
      - pattern: $VAR = "..."
      - pattern-not: $VAR = ""
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|passwd|secret|api_key|apikey|access_token|auth_token|private_key)$
      - metavariable-pattern:
          metavariable: $VAR
          patterns:
            - pattern-not-regex: (?i)^(test_|TEST_|dummy_|DUMMY_|example_|EXAMPLE_|placeholder_|fake_|DEFAULT_|default_).*
      - pattern-not-inside: |
          class $C(BaseSettings):
              ...
      - pattern-not-inside: |
          class $C(BaseSettings, ...):
              ...
