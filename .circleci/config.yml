version: 2.1

# Why this file exists: this repo's GitHub Actions minutes ran out. The unit
# test jobs and the dogfooding security scan moved here, onto CircleCI's free
# tier, so GitHub's remaining budget is reserved for the two jobs that cannot
# move -- `Docker Images Build` (needs a real Docker daemon) and
# `Publish Docker Images` (needs GITHUB_TOKEN to push to GHCR).
#
# Measured before the move, over the last 100 runs: backend tests 42 min,
# frontend tests 28 min, self-scan 76 min, mcp-server tests 2 min. That is
# ~148 of ~270 billed minutes now off GitHub's meter.
#
# Deliberately NOT using the path-filtering orb, even though the GitHub
# workflows this replaces had `paths:` filters. That orb needs a setup
# pipeline that diffs against a base revision, and on a push to main the base
# revision *is* main -- the diff comes back empty and every job silently
# skips. A CI that quietly runs nothing on the default branch is a worse
# failure than a few wasted container-minutes, and CircleCI's free tier is
# roughly an order of magnitude larger than the workload being moved here.
# Everything runs on every pipeline; caching keeps that cheap.

jobs:
  backend-tests:
    docker:
      # Same images as the GitHub `services:` block used, so a failure here
      # means the same thing it meant there. On CircleCI the secondary
      # containers share the primary's network interface, which is why the
      # DATABASE_URL/REDIS_URL below still point at localhost.
      - image: cimg/python:3.12
      - image: postgres:16
        environment:
          POSTGRES_USER: rikugan
          POSTGRES_PASSWORD: rikugan
          POSTGRES_DB: rikugan
      - image: redis:7
    working_directory: ~/project/backend
    environment:
      DATABASE_URL: postgresql+psycopg://rikugan:rikugan@localhost:5432/rikugan
      REDIS_URL: redis://localhost:6379/0
    steps:
      - checkout:
          path: ~/project

      # CircleCI has no equivalent of the `--health-cmd` options the GitHub
      # services used, and the primary container is ready well before Postgres
      # finishes initdb. Without this the first test to open a connection
      # loses a race that looks like a flaky test rather than a startup order
      # problem. Bash's /dev/tcp is used so this needs nothing installed.
      - run:
          name: Wait for Postgres and Redis
          command: |
            for _ in $(seq 1 45); do
              if (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null && (exec 3<>/dev/tcp/localhost/6379) 2>/dev/null; then
                echo "services up"
                exit 0
              fi
              sleep 2
            done
            echo "Postgres/Redis did not accept connections within 90s" >&2
            exit 1

      - restore_cache:
          keys:
            - pip-backend-v1-{{ checksum "requirements.txt" }}
            - pip-backend-v1-
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - save_cache:
          key: pip-backend-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

      - run:
          name: Run pytest
          # --junitxml is new here; GitHub had no equivalent. It only writes a
          # report, it does not change what passes, and it is what makes a
          # failure readable in CircleCI's UI without opening raw log output.
          command: python -m pytest -v --junitxml=test-results/pytest.xml
      - store_test_results:
          path: test-results

  frontend-tests:
    docker:
      - image: cimg/node:22.23
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - npm-frontend-v1-{{ checksum "package-lock.json" }}
            - npm-frontend-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-frontend-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Run unit and component tests
          command: npm test

      # Issue #206: the custom ESLint rule that blocks a Server Component
      # importing a value out of a "use client" module. Run explicitly --
      # its fixtures contain the violation on purpose and are ignored by the
      # normal lint pass.
      - run:
          name: Test custom lint rules
          command: npm run test:lint-rules

      # --max-warnings=0 is deliberate: the tree is at zero, and warnings that
      # are allowed to accumulate stop being read.
      - run:
          name: Lint
          command: npm run lint -- --max-warnings=0

      - run:
          name: Build (also generates Next.js route types and type-checks)
          command: npm run build
          environment:
            NEXT_PUBLIC_API_URL: http://localhost:8000

  mcp-server-tests:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project/mcp-server
    environment:
      RIKUGAN_API_TOKEN: rikugan_pat_test
      RIKUGAN_API_URL: http://localhost:8000
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - pip-mcp-v1-{{ checksum "requirements-dev.txt" }}
            - pip-mcp-v1-
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements-dev.txt
      - save_cache:
          key: pip-mcp-v1-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run pytest
          command: python -m pytest -v --junitxml=test-results/pytest.xml
      - store_test_results:
          path: test-results

  # The three scan jobs below are the dogfooding pass: Rikugan wraps these same
  # open-source tools, so the platform runs them against its own source. As on
  # GitHub, results go to artifacts and the job log rather than GitHub code
  # scanning -- SARIF upload to the Security tab needs GitHub Advanced
  # Security, which this private repo's plan does not include. gosec stays
  # excluded: it is Go-specific and this repo has no Go source.
  #
  # Each `|| true` is intentional. These jobs report what the scanners found;
  # they are not a merge gate. A findings count that grows is a signal to read,
  # not a red check that blocks an unrelated PR.
  semgrep:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Semgrep
          # `setuptools<81` for the same reason as backend/Dockerfile: semgrep's
          # pinned opentelemetry-instrumentation imports `pkg_resources`, which
          # setuptools removed in 82.0.0 and deprecated in 81. A silently broken
          # security scan is worse than a loud one.
          command: pip install semgrep "setuptools<81"
      - run:
          name: Run Semgrep
          command: semgrep scan --config=auto --json --output=semgrep.json || true
      - run:
          name: Summarize
          command: |
            python3 -c "
            import json
            d = json.load(open('semgrep.json'))
            results = d.get('results', [])
            print(f'## Semgrep: {len(results)} findings')
            for r in results[:20]:
                print(f\"- {r['extra']['severity']} {r['check_id']}: {r['path']}:{r['start']['line']}\")
            "
      - store_artifacts:
          path: semgrep.json
          destination: semgrep-results/semgrep.json

  gitleaks:
    docker:
      - image: cimg/base:current
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Gitleaks
          command: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - run:
          name: Run Gitleaks
          # --no-git scans the working tree rather than history, so unlike the
          # GitHub job this needs no full-depth clone.
          command: |
            ./gitleaks detect --report-format json --report-path gitleaks.json --no-git --exit-code 0
            python3 -c "
            import json
            d = json.load(open('gitleaks.json'))
            print(f'## Gitleaks: {len(d)} findings')
            for r in d[:20]:
                print(f\"- {r['RuleID']}: {r['File']}:{r['StartLine']}\")
            "
      - store_artifacts:
          path: gitleaks.json
          destination: gitleaks-results/gitleaks.json

  trivy:
    docker:
      - image: cimg/base:current
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Trivy
          # Pinned installer + checksum, matching what backend/Dockerfile does
          # (finding BLD-04, merged in #234). This started out unpinned on the
          # reasoning that "a scanner pinned to an old release stops knowing
          # about new vulnerabilities" -- which does not hold: trivy downloads
          # its vulnerability database separately at scan time (that DB, and
          # its cache, is what issue #229 was about). Pinning the *binary*
          # freezes the scanner engine, not its vulnerability knowledge.
          #
          # What was actually unpinned was the install *script*, fetched from
          # a branch tip -- a mutable URL piped into `sudo sh`. That is the
          # supply-chain hole BLD-04 named, and a security product's own CI is
          # the last place to leave one open.
          #
          # To bump: change TRIVY_VERSION, re-fetch, and record the new sum
          # with `curl -sSL <url> | sha256sum`.
          command: |
            TRIVY_VERSION=0.73.0
            TRIVY_INSTALLER_SHA256=e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a
            curl -sSL -o /tmp/trivy-install.sh \
              "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh"
            echo "${TRIVY_INSTALLER_SHA256}  /tmp/trivy-install.sh" | sha256sum -c -
            sudo sh /tmp/trivy-install.sh -b /usr/local/bin "v${TRIVY_VERSION}"
            rm -f /tmp/trivy-install.sh
            trivy --version
      - run:
          name: Run Trivy (filesystem scan)
          command: trivy fs --format json --output trivy.json . || true
      - run:
          name: Summarize
          command: |
            python3 -c "
            import json
            d = json.load(open('trivy.json'))
            count = sum(len(r.get('Vulnerabilities') or []) + len(r.get('Misconfigurations') or []) for r in d.get('Results', []))
            print(f'## Trivy: {count} findings across {len(d.get(\"Results\", []))} targets')
            "
      - store_artifacts:
          path: trivy.json
          destination: trivy-results/trivy.json

  # --- Image builds (moved off GitHub Actions, 2026-08-21) ----------------
  # These were the last heavy jobs left on Actions, kept there because they
  # need a real Docker daemon. CircleCI's machine executor provides one, so
  # the only real blocker was never checked. Actions minutes ran out a second
  # time; this is what was consuming them.
  #
  # Why the builds exist at all: every other job runs Python and Node
  # directly against whatever the runner already has. None of them build the
  # images docker-compose.yml actually ships, so a broken image could -- and
  # did -- reach main with every check green. The break: nothing asks for
  # setuptools directly, but semgrep's pinned opentelemetry-instrumentation
  # declares setuptools>=16.0, pip resolved 82.0.0, which removed
  # pkg_resources, which that same module imports. requirements.txt had not
  # changed; a transitive resolve drifted underneath it.
  build-image:
    parameters:
      # NOT named `context`: CircleCI reserves that key on a workflow job for
      # Contexts (secret bundles), so a parameter by that name is swallowed
      # rather than passed through.
      context_name:
        type: string
      dockerfile:
        type: string
    machine:
      image: ubuntu-2204:current
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Build << parameters.context_name >> image
          # Never pushed: this proves the image builds, it does not publish.
          #
          # Deliberately --no-cache. A cached layer is exactly what would
          # hide a dependency resolving differently, which is the whole
          # failure mode this job exists to catch.
          command: |
            docker build \
              --no-cache \
              --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
              -f << parameters.dockerfile >> \
              -t rikugan-ci-image:latest \
              << parameters.context_name >>
      - run:
          name: Verify bundled scanners actually run
          # "docker build succeeded" only proves the install commands exited
          # zero. It does not prove the binaries still run -- and a scanner
          # that is missing or broken fails silently at runtime, producing
          # zero findings that look exactly like a clean repo.
          #
          # Skipped for the distroless hardened image, which has no shell and
          # no Python entrypoint to drive this with; its scanners come from
          # the same install steps as the standard image, verified here.
          command: |
            case "<< parameters.dockerfile >>" in
              backend/Dockerfile)
                docker run --rm rikugan-ci-image:latest python scripts/verify_tools.py
                ;;
              *)
                echo "skipped for << parameters.dockerfile >> (distroless has no shell; frontend ships no scanners)"
                ;;
            esac

  compose-config:
    # Cheap and fast, so it runs regardless of the image builds: catches a
    # compose file referencing a service, image or build context that does
    # not exist.
    machine:
      image: ubuntu-2204:current
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Validate docker-compose.yml
          command: docker compose -f docker-compose.yml config --quiet

workflows:
  # Three things this migration needs that config.yml cannot express. They
  # live in the CircleCI UI, so they are invisible to anyone reading the repo
  # -- recorded here, with their state as of 2026-08-21.
  #
  # 1. Auto-cancel redundant workflows -- ON.
  #    Project Settings > Advanced. #233 added `concurrency: cancel-in-progress`
  #    to every GitHub workflow so a force-push during review stopped paying
  #    for a run whose result could no longer matter. Four of those workflows
  #    moved here, and CircleCI has no config-level equivalent. Left off, this
  #    migration silently gives back the saving #233 made.
  #
  # 2. Weekly self-scan -- schedule trigger "weekly-self-scan", Mon 06:00 UTC
  #    on main. Project Settings > Project Setup > Trigger on.
  #    The old .github/workflows/self-scan.yml ran on push, on PRs, AND on
  #    `cron: "0 6 * * 1"`. The workflow below reproduces push and PR; cron is
  #    a scheduled *pipeline*, not config. #236 moved the file without it, so
  #    for a while the dogfooding scan only ran when someone happened to push
  #    -- a new CVE in a dependency would have sat unseen until the next
  #    commit. Deleting that trigger reintroduces exactly that gap.
  #
  # 3. Pass secrets to builds from forked pull requests -- OFF, deliberately.
  #    Project Settings > Advanced. It was on by default. This repo takes PRs
  #    from outside collaborators, and it is a security product; a forked PR
  #    must never receive project env vars or the shared build cache. Turning
  #    on "Build forked pull requests" is fine on its own -- just leave this
  #    one off.
  test-and-scan:
    jobs:
      - backend-tests
      - frontend-tests
      - mcp-server-tests
      - semgrep
      - gitleaks
      - trivy
      - compose-config
      # fail-fast is off by construction here: independent jobs, so a broken
      # frontend build does not cancel the backend one. When both are broken,
      # one run reports both.
      - build-image:
          name: build-backend
          context_name: backend
          dockerfile: backend/Dockerfile
      - build-image:
          name: build-backend-hardened
          context_name: backend
          dockerfile: backend/Dockerfile.hardened
      - build-image:
          name: build-frontend
          context_name: frontend
          dockerfile: frontend/Dockerfile
